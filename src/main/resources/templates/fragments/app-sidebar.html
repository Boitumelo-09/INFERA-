<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<aside class="sidebar" id="sidebar" th:fragment="sidebar(active)">
    <div class="sidebar-logo">
        <a th:href="@{/home}" class="logo-link d-flex align-items-center gap-2">
            <div class="logo-mark">
                <svg class="logo-icon" xmlns="http://www.w3.org/2000/svg" viewBox="38.5 26.5 132.5 147" aria-hidden="true">
                    <path d="M162.4 60.6A64 64 0 1 0 112 164C132 164 142 156 142 140V104" fill="none" stroke="currentColor" stroke-width="13"/>
                    <path d="M94 134V92M94 110C94 94 106 86 120 86C134 86 142 96 142 110" fill="none" stroke="currentColor" stroke-width="13"/>
                    <circle cx="94" cy="72" r="8" fill="currentColor"/>
                </svg>
            </div>
            <span class="logo-text">incaptur.</span>
        </a>
        <button class="sidebar-close" id="sidebarClose" aria-label="Close sidebar"><i class="bi bi-x-lg"></i></button>
    </div>
    <button class="sidebar-collapse-btn" id="sidebarCollapseBtn" aria-label="Collapse sidebar">
        <i class="bi bi-chevron-left"></i>
    </button>

    <div class="sidebar-search" id="searchTrigger" role="button" tabindex="0"><i class="bi bi-search"></i><span>Search...</span><kbd>⌘K</kbd></div>
    <nav class="sidebar-nav">
        <div class="nav-section-label">Main</div>
        <ul class="nav-list">
            <li><a th:href="@{/dashboard}" class="nav-item"><i class="bi bi-grid-1x2"></i><span>Dashboard</span></a></li>
            <li><a th:href="@{/workspaces}" class="nav-item" th:classappend="${active == 'workspaces'} ? 'active'"><i class="bi bi-folder2-open"></i><span>Workspaces</span><span class="nav-badge" th:text="${workspaceCount}">0</span></a></li>
            <li><a th:href="@{/notes}" class="nav-item"><i class="bi bi-journal-text"></i><span>Notes</span><span class="nav-badge" th:text="${noteCount}">0</span></a></li>
            <li><a th:href="@{/resources}" class="nav-item"><i class="bi bi-link-45deg"></i><span>Resources</span><span class="nav-badge" th:text="${resourceCount}">0</span></a></li>
        </ul>
        <div class="nav-section-label mt-3">Account</div>
        <ul class="nav-list">
            <li><a th:href="@{/activity}" class="nav-item"><i class="bi bi-clock-history"></i><span>Activity</span></a></li>
            <li><a th:href="@{/profile}" class="nav-item"><i class="bi bi-person-circle"></i><span>Profile</span></a></li>
            <li><a th:href="@{/settings}" class="nav-item"><i class="bi bi-gear"></i><span>Settings</span></a></li>
        </ul>
    </nav>
    <div class="sidebar-user">
        <div class="topbar-right d-flex align-items-center gap-2 gap-sm-3">
            <img th:if="${user.avatarUrl}" th:src="${user.avatarUrl}" alt="Avatar" class="topbar-avatar-img"
                 onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';" />
            <div th:style="${user.avatarUrl} ? 'display:none' : 'display:flex'" class="topbar-avatar" th:text="${#strings.substring(user.firstName,0,1) + #strings.substring(user.lastName,0,1)}">SN</div>
        </div>
        <div class="user-info">
            <div class="user-name" th:text="${user.firstName + ' ' + user.lastName}">Name</div>
            <div class="user-email" th:text="${user.email}">email</div>
        </div>
        <form th:action="@{/logout}" method="post" style="margin:0;">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <button type="submit" class="logout-btn" title="Sign out"><i class="bi bi-box-arrow-right"></i></button>
        </form>
    </div>
</aside>

<div class="sidebar-overlay" id="sidebarOverlay" th:fragment="overlay"></div>

<div class="search-modal" id="searchModal" role="dialog" aria-modal="true" aria-label="Search" hidden th:fragment="search">
    <div class="search-backdrop" id="searchBackdrop"></div>
    <div class="search-box">
        <div class="search-input-wrap">
            <i class="bi bi-search search-input-icon"></i>
            <input type="text" class="search-input" id="searchInput" placeholder="Search notes, workspaces, resources..." autocomplete="off" />
            <kbd class="search-esc">ESC</kbd>
        </div>
        <div class="search-results" id="searchResults">
            <div class="search-hint"><i class="bi bi-lightning-charge"></i> Type to search across all your workspaces</div>
        </div>
        <div class="search-footer">
            <span><kbd>↑</kbd><kbd>↓</kbd> navigate</span>
            <span><kbd>↵</kbd> open</span>
            <span><kbd>ESC</kbd> close</span>
        </div>
    </div>
</div>

</body>
</html>
