<div xmlns:th="http://www.thymeleaf.org" th:fragment="hub" class="hub-content">

    <div class="modal-body">
        <!-- OWNER ONLY: rendered server-side, other roles never receive this HTML -->
        <th:block th:if="${hub.isOwner()}">
            <div class="hub-section-label">Invite someone</div>
            <form class="hub-invite-form" method="post"
                  th:action="@{/workspaces/{id}/members/invitations(id=${hub.workspace().id})}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <input type="email" name="email" class="form-input hub-invite-email"
                       placeholder="name@example.com" required maxlength="150" autocomplete="off"
                       aria-label="Email address" />
                <select name="role" class="form-input hub-invite-role" aria-label="Role">
                    <option value="EDITOR" selected>Editor</option>
                    <option value="VIEWER">Viewer</option>
                </select>
                <button type="submit" class="btn-modal-accent hub-invite-btn">Invite</button>
            </form>
            <p class="hub-hint">editors can create and edit notes. viewers can only read.</p>

            <th:block th:if="${!#lists.isEmpty(pending)}">
                <div class="hub-section-label">
                    <span class="hub-count" th:text="${#lists.size(pending)}"></span> Pending invitations
                </div>
                <ul class="hub-members hub-pending">
                    <li class="hub-member" th:each="inv : ${pending}">
                        <span class="hub-member-info">
                            <span class="hub-member-name"><span th:text="${inv.email}">name@example.com</span></span>
                            <span class="hub-member-email">
                                Expires <span th:text="${#temporals.format(inv.expiresAt, 'dd MMM yyyy')}">17 Nov 2026</span>
                            </span>
                        </span>
                        <span class="ws-role-badge"
                              th:classappend="'role-' + ${#strings.toLowerCase(inv.role.name())}"
                              th:text="${#strings.capitalize(#strings.toLowerCase(inv.role.name()))}">Editor</span>
                        <form method="post" class="hub-revoke-form"
                              th:action="@{/workspaces/{wid}/members/invitations/{iid}/revoke(wid=${hub.workspace().id}, iid=${inv.id})}">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                            <button type="submit" class="hub-revoke-btn">Revoke</button>
                        </form>
                    </li>
                </ul>
            </th:block>
            <div class="hub-divider"></div>
        </th:block>
        <div class="hub-section-label">
            <span class="hub-count" th:text="${#lists.size(hub.members())}">0</span> Members
        </div>

        <ul class="hub-members">
            <li class="hub-member" th:each="m : ${hub.members()}">
                <span class="hub-av">
                    <span th:text="${#strings.isEmpty(m.user.firstName) ? '?' : #strings.toUpperCase(#strings.substring(m.user.firstName, 0, 1))}">S</span>
                    <img th:if="${m.user.avatarUrl}" th:src="${m.user.avatarUrl}" alt="" onerror="this.remove()" />
                </span>

                <span class="hub-member-info">
                    <span class="hub-member-name">
                        <span th:text="${#strings.trim((m.user.firstName ?: '') + ' ' + (m.user.lastName ?: ''))}">Sipho Ndlovu</span>
                        <span class="hub-you" th:if="${m.user.id.equals(hub.myUserId())}">You</span>
                    </span>
                    <!-- emails are owner-only: left out of the HTML entirely for everyone else -->
                    <span class="hub-member-email" th:if="${hub.isOwner()}" th:text="${m.user.email}">sipho@example.com</span>
                </span>

                <span class="ws-role-badge"
                      th:classappend="'role-' + ${#strings.toLowerCase(m.role.name())}"
                      th:text="${#strings.capitalize(#strings.toLowerCase(m.role.name()))}">Owner</span>

                <div th:if="${hub.isOwner() and m.role.name() != 'OWNER'}" class="hub-menu-wrap"
                     th:with="otherRole=${m.role.name() == 'EDITOR' ? 'VIEWER' : 'EDITOR'}">
                    <button type="button" class="hub-menu-toggle" aria-haspopup="true" aria-expanded="false"
                            aria-label="Member options">
                        <i class="bi bi-chevron-down"></i>
                    </button>
                    <div class="hub-menu" role="menu">
                        <form method="post"
                              th:action="@{/workspaces/{wid}/members/{mid}/role(wid=${hub.workspace().id}, mid=${m.id})}">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                            <input type="hidden" name="role" th:value="${otherRole}" />
                            <button type="submit" class="hub-menu-item" role="menuitem">
                                <i class="bi bi-arrow-left-right"></i>
                                <span th:text="${'Make ' + (otherRole == 'EDITOR' ? 'Editor' : 'Viewer')}">Make Viewer</span>
                            </button>
                        </form>
                        <form method="post"
                              th:action="@{/workspaces/{wid}/members/{mid}/remove(wid=${hub.workspace().id}, mid=${m.id})}">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                            <button type="submit" class="hub-menu-item danger hub-confirm-btn" role="menuitem">
                                <i class="bi bi-person-x"></i> <span>Remove from workspace</span>
                            </button>
                        </form>
                    </div>
                </div>
            </li>
        </ul>
    </div>

    <div class="modal-footer">
        <form th:unless="${hub.isOwner()}" method="post" class="hub-leave-form"
              th:action="@{/workspaces/{id}/members/leave(id=${hub.workspace().id})}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <button type="submit" class="hub-revoke-btn hub-confirm-btn">Leave workspace</button>
        </form>
        <button type="button" class="btn-modal-ghost" data-bs-dismiss="modal">Close</button>
        <a class="btn-modal-accent hub-open-notes" th:href="@{/notes(workspace=${hub.workspace().id})}">
            <i class="bi bi-journal-text"></i> Open notes
        </a>
    </div>
</div>
