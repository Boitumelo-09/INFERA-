<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="sidebar(active)">
    <aside class="sidebar" id="sidebar">

        <div class="sidebar-logo">
            <a th:href="@{/home}" class="logo-link d-flex align-items-center gap-2">
                <div class="logo-mark">
                    <svg class="logo-icon" xmlns="http://www.w3.org/2000/svg" viewBox="38.5 26.5 132.5 147" aria-hidden="true">
                        <path d="M162.4 60.6A64 64 0 1 0 112 164C132 164 142 156 142 140V104" fill="none" stroke="currentColor" stroke-width="13"/>
                        <path d="M94 134V92M94 110C94 94 106 86 120 86C134 86 142 96 142 110" fill="none" stroke="currentColor" stroke-width="13"/>
                        <circle cx="94" cy="72" r="8" fill="currentColor"/>
                    </svg>
                </div>
                <span class="logo-text">incaptur.</span>
            </a>
            <button class="sidebar-close" id="sidebarClose" aria-label="Close sidebar"><i class="bi bi-x-lg"></i></button>
        </div>
        <button class="sidebar-collapse-btn" id="sidebarCollapseBtn" aria-label="Collapse sidebar">
            <i class="bi bi-chevron-left"></i>
        </button>

        <div class="sidebar-search" id="searchTrigger" role="button" tabindex="0" aria-label="Open search">
            <i class="bi bi-search"></i><span>Search...</span><kbd>⌘K</kbd>
        </div>

        <nav class="sidebar-nav" aria-label="Main navigation">
            <div class="nav-section-label">Main</div>
            <ul class="nav-list">
                <li><a th:href="@{/dashboard}" class="nav-item" th:classappend="${active == 'dashboard'} ? 'active'">
                    <i class="bi bi-grid-1x2"></i><span>Dashboard</span></a></li>
                <li><a th:href="@{/workspaces}" class="nav-item" th:classappend="${active == 'workspaces'} ? 'active'">
                    <i class="bi bi-folder2-open"></i><span>Workspaces</span>
                    <span class="nav-badge nav-badge-alert"
                          th:if="${pendingInvitationCount != null and pendingInvitationCount > 0}"
                          th:text="${pendingInvitationCount}"
                          th:title="${pendingInvitationCount == 1 ? '1 pending invitation' : pendingInvitationCount + ' pending invitations'}">1</span>
                    <span class="nav-badge" id="navWorkspaceBadge" th:text="${workspaceCount}">0</span></a></li>
                <li><a th:href="@{/notes}" class="nav-item" th:classappend="${active == 'notes'} ? 'active'">
                    <i class="bi bi-journal-text"></i><span>Notes</span>
                    <span class="nav-badge" id="navNotesBadge" th:text="${noteCount}">0</span></a></li>
                <li><a th:href="@{/resources}" class="nav-item" data-page="resources" th:classappend="${active == 'resources'} ? 'active'">
                    <i class="bi bi-link-45deg"></i><span>Resources</span>
                    <span th:text="${resourceCount}" class="nav-badge" id="navResourcesBadge">0</span></a></li>
            </ul>
            <th:block th:if="${active == 'dashboard' and workspaces != null}">
                <div class="nav-section-label mt-3">Workspaces</div>
                <ul class="nav-list" id="workspaceList">
                    <li th:each="ws : ${workspaces}">
                        <a th:href="@{/workspaces}" class="nav-item ws-item">
                            <span class="ws-dot" th:style="'--ws-color:' + ${ws.color}"></span>
                            <span class="ws-nav-name" th:text="${ws.name}">Workspace</span>
                        </a>
                    </li>
                    <li>
                        <button class="nav-item nav-item-btn" id="newWorkspaceBtn">
                            <i class="bi bi-plus"></i>
                            <span>New workspace</span>
                        </button>
                    </li>
                </ul>
            </th:block>

            <div class="nav-section-label mt-3">Account</div>
            <ul class="nav-list">
                <li><a th:href="@{/activity}" class="nav-item" th:classappend="${active == 'activity'} ? 'active'"><i class="bi bi-clock-history"></i><span>Activity</span></a></li>
                <li><a th:href="@{/profile}" class="nav-item" th:classappend="${active == 'profile'} ? 'active'"><i class="bi bi-person-circle"></i><span>Profile</span></a></li>
                <li><a th:href="@{/settings}" class="nav-item" th:classappend="${active == 'settings'} ? 'active'"><i class="bi bi-gear"></i><span>Settings</span></a></li>
            </ul>
        </nav>

        <div class="sidebar-user">
            <div class="topbar-right d-flex align-items-center gap-2 gap-sm-3">
                <img th:if="${user.avatarUrl}" th:src="${user.avatarUrl}" alt="Avatar" class="topbar-avatar-img"
                     onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';" />
                <div th:style="${user.avatarUrl} ? 'display:none' : 'display:flex'" class="topbar-avatar"
                     th:text="${#strings.substring(user.firstName,0,1) + #strings.substring(user.lastName,0,1)}">SN</div>
            </div>
            <div class="user-info">
                <div class="user-name" th:text="${user.firstName + ' ' + user.lastName}">Sipho Ndlovu</div>
                <div class="user-email" th:text="${user.email}">sipho@example.com</div>
            </div>
            <form th:action="@{/logout}" method="post" style="margin:0;">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="logout-btn" title="Sign out"><i class="bi bi-box-arrow-right"></i></button>
            </form>
        </div>

    </aside>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
</th:block>
