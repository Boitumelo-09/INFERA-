<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:attr="data-theme=${user != null ? user.themePreference : 'default'}">
<head>
    <script>
        if (localStorage.getItem('sidebarCollapsed') === 'true') {
            document.documentElement.classList.add('sb-collapsed', 'no-sb-transition');
        }
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${pageTitle}">members | incaptur</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&family=Outfit:wght@500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" th:href="@{/cssStyles/dashboard.css}" />
    <link rel="stylesheet" th:href="@{/cssStyles/settings.css}" />
    <link rel="stylesheet" th:href="@{/cssStyles/app.css}" />
    <link rel="icon" th:href="@{/favicons/favicon.ico}" sizes="48x48">
    <link rel="icon" type="image/svg+xml" th:href="@{/favicons/favicon.svg}">
    <meta name="theme-color" content="#161b22">
    <style>
        .inv-btn { background: var(--accent); color: #0d1117; border: 0; border-radius: 10px; padding: 10px 18px;
            font-weight: 600; font-size: .86rem; cursor: pointer; }
        .inv-btn:hover { opacity: .9; }
        .inv-form { display: flex; gap: 10px; flex-wrap: wrap; padding: 16px 20px; }
        .inv-form .form-input { padding-left: 14px; flex: 1 1 220px; }
        .inv-form select.form-input { flex: 0 0 200px; }
    </style>
</head>
<body>

<div class="cursor-dot" id="cursorDot"></div>
<div class="cursor-ring" id="cursorRing"></div>

<aside th:replace="~{fragments/app-sidebar :: sidebar('workspaces')}"></aside>
<div th:replace="~{fragments/app-sidebar :: overlay}"></div>

<div class="main-wrapper" id="mainWrapper">
    <header class="topbar">
        <div class="topbar-left">
            <button class="sidebar-toggle" id="sidebarToggle"><i class="bi bi-list"></i></button>
            <nav aria-label="breadcrumb" class="d-none d-sm-flex">
                <ol class="breadcrumb mb-0">
                    <li class="breadcrumb-item"><a th:href="@{/workspaces}">workspaces</a></li>
                    <li class="breadcrumb-item active">members</li>
                </ol>
            </nav>
        </div>
    </header>

    <main class="page-content">
        <div class="res-page-header">
            <div>
                <h1 class="res-page-title">Invite people to <span th:text="${workspace.name}">Workspace</span></h1>
                <p class="res-page-sub">Editors can create and edit content. Viewers can only read. Invitations expire after a few days.</p>
            </div>
        </div>

        <div class="dash-panel settings-section">
            <div class="panel-header"><h2 class="panel-title"><i class="bi bi-person-plus"></i> Send an invitation</h2></div>
            <form class="inv-form" th:action="@{/workspaces/{id}/members/invitations(id=${workspace.id})}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <input type="email" name="email" class="form-input" placeholder="name@example.com" maxlength="150" autocomplete="off" required />
                <select name="role" class="form-input">
                    <option value="EDITOR">Editor: can edit</option>
                    <option value="VIEWER" selected>Viewer: read only</option>
                </select>
                <button type="submit" class="inv-btn">Invite</button>
            </form>
        </div>

        <div class="dash-panel settings-section">
            <div class="panel-header"><h2 class="panel-title"><i class="bi bi-hourglass-split"></i> Pending invitations</h2></div>
            <div th:if="${#lists.isEmpty(pendingInvitations)}" class="settings-row">
                <div><div class="settings-row-sub">No pending invitations.</div></div>
            </div>
            <div class="settings-row" th:each="inv : ${pendingInvitations}">
                <div>
                    <div class="settings-row-label" th:text="${inv.email}">email</div>
                    <div class="settings-row-sub">
                        <span th:text="${#strings.capitalize(#strings.toLowerCase(inv.role.name()))}">Viewer</span>
                        · expires <span th:text="${#temporals.format(inv.expiresAt, 'dd MMM yyyy, HH:mm')}">date</span>
                    </div>
                </div>
                <form th:action="@{/workspaces/{id}/members/invitations/{iid}/revoke(id=${workspace.id},iid=${inv.id})}" method="post" style="margin:0;">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <button type="submit" class="btn-danger-outline">Revoke</button>
                </form>
            </div>
        </div>

        <div th:replace="~{fragments/app-sidebar :: search}"></div>
    </main>
</div>

<div class="infera-toast" id="inferaToast" role="status" aria-live="polite" aria-atomic="true">
    <div class="toast-icon" id="toastIcon"><i class="bi bi-check2-circle"></i></div>
    <span class="toast-msg" id="toastMsg">Done!</span>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script>
    function showToast(message, isError) {
        const toast = document.getElementById('inferaToast');
        const icon = document.getElementById('toastIcon');
        document.getElementById('toastMsg').textContent = message;
        icon.innerHTML = isError ? '<i class="bi bi-exclamation-circle"></i>' : '<i class="bi bi-check2-circle"></i>';
        icon.classList.toggle('error', !!isError);
        toast.classList.add('show');
        clearTimeout(toast._timer);
        toast._timer = setTimeout(() => toast.classList.remove('show'), 3800);
    }
</script>
<script th:if="${toast}" th:inline="javascript">document.addEventListener('DOMContentLoaded', () => showToast([[${toast}]], false));</script>
<script th:if="${toastError}" th:inline="javascript">document.addEventListener('DOMContentLoaded', () => showToast([[${toastError}]], true));</script>
<script th:if="${errorMessage}" th:inline="javascript">document.addEventListener('DOMContentLoaded', () => showToast([[${errorMessage}]], true));</script>
<script src="/javaScript/utility.js" th:src="@{/javaScript/utility.js}"></script>
</body>
</html>
