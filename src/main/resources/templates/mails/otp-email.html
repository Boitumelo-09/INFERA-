<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <meta name="supported-color-schemes" content="dark">
    <title>INCAPTUR Verification Code</title>
</head>

<body style="
    margin: 0;
    padding: 0;
    background-color: #0d1117;
    font-family: 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif;
">

<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0"
       style="width: 100%; background-color: #0d1117; padding: 48px 15px;">
    <tr>
        <td align="center">

            <!-- Main Email Card -->
            <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0"
                   style="
                    max-width: 560px;
                    width: 100%;
                    background-color: #1c2128;
                    border: 1px solid transparent;
                    border-radius: 16px;
                    overflow: hidden;
                ">

                <!-- HEADER -->
                <tr>
                    <td align="center" style="padding: 40px 30px 32px; background-color: #161b22; border-bottom: 1px solid transparent;">
                        <img
                                src="cid:logo"
                                alt="INCAPTUR"
                                width="200"
                                style="display: block; width: 200px; max-width: 100%; height: auto; border: 0; margin-bottom: 14px; pointer-events: none;"

                        />
                        <div style="
                            font-family: 'Sora', 'Segoe UI', Arial, sans-serif;
                            font-weight: 800;
                            font-size: 18px;
                            letter-spacing: 0.06em;
                            color: #f8fafc;
                            text-transform: lowercase;
                        ">

                        </div>
                    </td>
                </tr>

                <!-- CONTENT -->
                <tr>
                    <td style="padding: 44px 36px 36px; text-align: center;">

                        <div style="
                            display: inline-block;
                            padding: 5px 14px;
                            background-color: transparent;
                            border: 1px solid transparent;
                            border-radius: 99px;
                            font-size: 12px;
                            font-weight: 600;
                            color: #fb923c;
                            margin-bottom: 22px;
                        ">
                            Here's your verification code
                        </div>

                        <h1 style="
                            margin: 0 0 12px;
                            font-family: 'Sora', 'Segoe UI', Arial, sans-serif;
                            color: #f8fafc;
                            font-size: 24px;
                            font-weight: 800;
                            line-height: 1.3;
                        ">
                            Confirm it's you
                        </h1>

                        <p style="margin: 0; color: #94a3b8; font-size: 15px; line-height: 1.6;">
                            Enter this code to continue signing in to your INCAPTUR account.
                        </p>

                        <!-- OTP CODE -->
                        <table role="presentation" cellspacing="0" cellpadding="0" border="0" style="margin: 32px auto;">
                            <tr>
                                <td style="
                                    padding: 20px 32px;
                                    background-color: #161b22;
                                    border: 1px solid transparent;
                                    border-radius: 12px;
                                ">
                                    <span style="
                                        font-family: 'JetBrains Mono',sans-serif;
                                        font-size: 1.5em;
                                        font-weight: 600;
                                        letter-spacing: 6px;
                                        color: #f8fafc;
                                    ">INC-<span th:text="${code}" style="color: #ea580c;"></span></span>
                                </td>
                            </tr>
                        </table>

                        <p style="margin: 0; color: #94a3b8; font-size: 13px; line-height: 1.6;">
                            This code expires in <strong style="color: #f8fafc;">10 minutes</strong>.
                        </p>

                        <p style="margin: 28px 0 0; color: #5a6472; font-size: 12px; line-height: 1.6;">
                            Didn't request this? You can safely ignore this email.
                        </p>

                    </td>
                </tr>

                <!-- FOOTER -->
                <tr>
                    <td style="padding: 22px 30px; background-color: #161b22; border-top: 1px solid #2a303a; text-align: center;">
                        <p style="margin: 0; color: #5a6472; font-size: 11px; letter-spacing: 0.03em;">
                            © 2026 incaptur.co.za &nbsp;·&nbsp; Capture Ideas.
                        </p>
                    </td>
                </tr>

            </table>

        </td>
    </tr>
</table>

</body>
</html>
