<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body style="margin:0;padding:24px;background:#0d1117;font-family:Arial,Helvetica,sans-serif;color:#e6edf3;">
<div style="max-width:560px;margin:0 auto;background:#161b22;border-radius:12px;padding:28px;">
    <p style="margin:0 0 4px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#8b949e;">
        INCAPTUR · <span th:text="${typeLabel}">Review</span>
    </p>
    <p style="margin:0 0 20px;font-size:15px;">
        From <strong th:text="${senderName}">Name</strong>
        (<a th:href="'mailto:' + ${senderEmail}" th:text="${senderEmail}" style="color:#b3b9c1;">email</a>)
    </p>
    <div th:text="${body}"
         style="white-space:pre-wrap;line-height:1.6;font-size:14px;background:#0d1117;border-radius:8px;padding:16px;">
        Message
    </div>
    <p style="margin:20px 0 0;font-size:12px;color:#8b949e;">
        Reply to this email to answer the user directly. © <span th:text="${currentYear}">2026</span> INCAPTUR
    </p>
</div>
</body>
</html>
