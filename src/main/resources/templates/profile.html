<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:attr="data-theme=${user != null ? user.themePreference : 'default'}"><head>
    <script>
        if (localStorage.getItem('sidebarCollapsed') === 'true') {
            document.documentElement.classList.add('sb-collapsed', 'no-sb-transition');
        }
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${pageTitle}"></title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" th:href="@{/cssStyles/dashboard.css}" />
    <link rel="stylesheet" th:href="@{/cssStyles/profile.css}" />
    <link rel="stylesheet" th:href="@{/cssStyles/app.css}" />
    <link rel="icon" href="/static/favicons/favicon.ico" sizes="48x48" th:href="@{/favicons/favicon.ico}">
    <link rel="icon" type="image/svg+xml" href="/static/favicons/favicon.svg" th:href="@{/favicons/favicon.svg}">
    <link rel="apple-touch-icon" href="/static/favicons/apple-touch-icon.png" th:href="@{/favicons/apple-touch-icon.png}">
    <link rel="manifest" href="/static/favicons/site.webmanifest" th:href="@{/favicons/site.webmanifest}">
    <meta name="theme-color" content="#161b22"></head>
<body>
<th:block th:replace="~{fragments/sidebar :: sidebar('profile')}"></th:block>

<div class="main-wrapper" id="mainWrapper">
    <header class="topbar">
        <div class="topbar-left">
            <button class="sidebar-toggle" id="sidebarToggle"><i class="bi bi-list"></i></button>
            <nav aria-label="breadcrumb" class="d-none d-sm-flex">
                <ol class="breadcrumb mb-0">
                    <li class="breadcrumb-item"><span class="bc-root" th:text="${user.firstName}+'\'s'">User's</span></li>
                    <li class="breadcrumb-item active">profile</li>
                </ol>
            </nav>
        </div>
    </header>

    <main class="page-content">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

        <section class="me">

            <div class="me-head">
                <div class="me-avatar-wrap">
                    <div class="me-avatar" id="avatarDropzone" role="button" tabindex="0" title="Change picture"
                         th:data-initials="${#strings.substring(user.firstName,0,1) + #strings.substring(user.lastName,0,1)}">
                        <img th:if="${user.avatarUrl}" th:src="${user.avatarUrl}" alt="Avatar" class="prof-avatar-img" id="avatarImg" />
                        <div th:unless="${user.avatarUrl}" class="prof-avatar-fallback" id="avatarFallback"
                             th:text="${#strings.substring(user.firstName,0,1) + #strings.substring(user.lastName,0,1)}">SN</div>
                        <div class="prof-avatar-overlay"><i class="bi bi-camera"></i></div>
                    </div>
                    <input type="file" id="avatarInput" accept="image/png,image/jpeg,image/webp" hidden />
                    <div class="prof-avatar-menu" id="avatarMenu">
                        <button type="button" id="avatarMenuUpdate"><i class="bi bi-upload"></i> Update picture</button>
                        <button type="button" id="avatarMenuDelete" class="danger"><i class="bi bi-trash3"></i> Delete picture</button>
                    </div>
                </div>
                <div class="me-head-text">
                    <p class="me-eyebrow">Your profile</p>
                    <p class="me-hint">Click anything to edit. It saves as you go.</p>
                </div>
            </div>

            <div class="me-name">
                <input type="text" id="firstNameInput" class="me-input me-name-input" data-field="firstName"
                       th:value="${user.firstName}" placeholder="First name" maxlength="100" autocomplete="off" />
                <input type="text" id="lastNameInput" class="me-input me-name-input" data-field="lastName"
                       th:value="${user.lastName}" placeholder="Last name" maxlength="100" autocomplete="off" />
            </div>

            <div class="me-field">
                <i class="bi bi-briefcase"></i>
                <input type="text" id="lifeRoleInput" class="me-input" data-field="lifeRole"
                       th:value="${user.lifeRole}" placeholder="What do you do?" maxlength="100" autocomplete="off" />
            </div>

            <div class="me-field">
                <i class="bi bi-geo-alt"></i>
                <input type="text" id="locationInput" class="me-input" data-field="location"
                       th:value="${user.location}" placeholder="Where are you based?" maxlength="100" autocomplete="off" />
            </div>

            <div class="me-field me-field-top">
                <i class="bi bi-quote"></i>
                <div class="me-bio-wrap">
                    <textarea id="bioInput" class="me-input me-bio" data-field="bio" rows="1" maxlength="280"
                              placeholder="A line or two about you…" th:text="${user.bio}"></textarea>
                    <span class="me-count" id="bioCount">0/280</span>
                </div>
            </div>

            <div class="me-divider"></div>

            <div class="me-field me-static">
                <i class="bi bi-envelope"></i>
                <span th:text="${user.email}">email</span>
            </div>
            <div class="me-field me-static">
                <i class="bi bi-calendar3"></i>
                <span>Member since <span th:text="${#temporals.format(user.createdAt, 'MMMM yyyy')}">date</span></span>
            </div>

        </section>

        <div class="search-modal" id="searchModal" role="dialog" aria-modal="true" aria-label="Search" hidden>
            <div class="search-backdrop" id="searchBackdrop"></div>
            <div class="search-box">
                <div class="search-input-wrap">
                    <i class="bi bi-search search-input-icon"></i>
                    <input type="text" class="search-input" id="searchInput" placeholder="Search notes, workspaces, resources..." autocomplete="off" />
                    <kbd class="search-esc">ESC</kbd>
                </div>
                <div class="search-results" id="searchResults">
                    <div class="search-hint"><i class="bi bi-lightning-charge"></i> Type to search across all your workspaces</div>
                </div>
                <div class="search-footer">
                    <span><kbd>↑</kbd><kbd>↓</kbd> navigate</span>
                    <span><kbd>↵</kbd> open</span>
                    <span><kbd>ESC</kbd> close</span>
                </div>
            </div>
        </div>
    </main>
</div>

<div class="infera-toast" id="inferaToast">
    <i class="bi bi-check-circle-fill toast-icon" id="toastIcon"></i>
    <span id="toastMessage">Saved</span>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/javaScript/profile_settings.js}"></script>
<script th:src="@{/javaScript/profile.js}"></script>

</body>
</html>
