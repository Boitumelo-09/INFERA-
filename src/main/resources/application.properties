spring.application.name=INFERA

server.port=8081

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:8080/INFERA_DB
spring.datasource.username=postgres
spring.datasource.password=${INFERA_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
  #FLYWAY
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.enabled=true
spring.flyway.validate-on-migrate=true


# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Thymeleaf
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML

#OAuth2
    #Google
spring.security.oauth2.client.registration.google.client-id=${INFERA_GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${INFERA_GOOGLE_CLIENT_SECRET}

spring.security.oauth2.client.registration.google.scope=openid,profile,email
    #GitHub
spring.security.oauth2.client.registration.github.client-id=${INFERA_GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${INFERA_GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=read:user,user:email

    #Microsoft
spring.security.oauth2.client.registration.microsoft.client-id=${INCAPTUR_MICROSOFT_CLIENT_ID}
spring.security.oauth2.client.registration.microsoft.client-secret=${INCAPTUR_MICROSOFT_CLIENT_SECRET}
spring.security.oauth2.client.registration.microsoft.scope=openid,profile,email
spring.security.oauth2.client.registration.microsoft.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.microsoft.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

spring.security.oauth2.client.provider.microsoft.authorization-uri=https://login.microsoftonline.com/common/oauth2/v2.0/authorize
spring.security.oauth2.client.provider.microsoft.token-uri=https://login.microsoftonline.com/common/oauth2/v2.0/token
spring.security.oauth2.client.provider.microsoft.jwk-set-uri=https://login.microsoftonline.com/common/discovery/v2.0/keys
spring.security.oauth2.client.provider.microsoft.user-info-uri=https://graph.microsoft.com/oidc/userinfo
spring.security.oauth2.client.provider.microsoft.user-name-attribute=sub
   #File Upload
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=3MB
app.upload-dir=uploads/avatars
#BREVO
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=b60fc4001@smtp-brevo.com
spring.mail.password=${INCAPTUR_SMTP_BREVO_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=noreply@incaptur.co.za
app.mail.from-name=INCAPTUR



